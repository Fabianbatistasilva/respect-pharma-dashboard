name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      completo:
        description: 'Tambem refazer a coleta da Respect Pharma (mais lenta)'
        type: boolean
        default: false
  schedule:
    # Coleta completa (inclui Respect Pharma): 06:00 e 18:00 em America/Sao_Paulo (UTC-3).
    - cron: '0 9,21 * * *'
    # Coleta rapida das lojas do comparador: a cada 20 minutos.
    - cron: '10,30,50 * * * *'

permissions:
  # write: o historico de precos e salvo no branch comparador-data.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Coleta rapida: so o comparador roda; os arquivos da Respect Pharma sao reaproveitados do site no ar.
      FULL: ${{ github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '0 9,21 * * *') || (github.event_name == 'workflow_dispatch' && inputs.completo) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        if: env.FULL == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: env.FULL == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run tests
        if: env.FULL == 'true'
        run: npm test

      - name: Run syntax checks
        run: npm run check

      - name: Scrape latest prices
        if: env.FULL == 'true'
        run: npm run scrape:respect

      - name: Reuse published Respect Pharma files
        if: env.FULL != 'true'
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p reports data screenshots
          for file in reports/respect_price_report.html reports/respect_price_report.md data/respect_products_raw.json data/respect_products.csv; do
            curl -fsS --retry 3 -o "$file" "$SITE/$file"
          done
          for file in screenshots/promo_page.png screenshots/main_page.png screenshots/pypharma_page.png; do
            curl -fsS --retry 3 -o "$file" "$SITE/$file" || rm -f "$file"
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # O historico de precos (SQLite, ultimos 90 dias) fica no branch comparador-data.
      - name: Restore price history
        id: history
        run: |
          mkdir -p comparador/data
          status=0
          git ls-remote --exit-code --heads origin comparador-data > /dev/null || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin comparador-data
            git show FETCH_HEAD:comparador.sqlite3 > comparador/data/comparador.sqlite3
          elif [ "$status" = 2 ]; then
            echo "::notice::Branch comparador-data ainda nao existe; historico comeca do zero."
          else
            exit "$status"
          fi

      - name: Run comparador tests
        if: env.FULL == 'true'
        working-directory: comparador
        run: python -m unittest discover -s tests

      # Uma loja fora do ar nao pode derrubar o deploy: o painel avisa o que faltou.
      - name: Build store comparison panel
        working-directory: comparador
        run: python comparador.py --config config.json --sem-alertas || echo "::warning::Comparador terminou com coleta incompleta"

      # Um unico commit, sempre substituido: o branch guarda so a versao atual do banco.
      - name: Save price history
        if: steps.history.outcome == 'success'
        run: |
          snapshot="$(mktemp -d)"
          cp comparador/data/comparador.sqlite3 "$snapshot/"
          cd "$snapshot"
          git init -q -b comparador-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparador.sqlite3
          git commit -q -m "Price history snapshot"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" comparador-data

      - name: Build static Pages artifact
        run: npm run publish:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
