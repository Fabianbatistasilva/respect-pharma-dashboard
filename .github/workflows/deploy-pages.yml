name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Runs every hour so the price panels stay close to the stores' catalogs.
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run syntax checks
        run: npm run check

      - name: Scrape latest prices
        run: npm run scrape:respect

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # O historico de precos do comparador vive no cache entre as execucoes.
      - name: Restore price history
        uses: actions/cache@v4
        with:
          path: comparador/data/comparador.sqlite3
          key: comparador-history-${{ github.run_id }}
          restore-keys: |
            comparador-history-

      - name: Run comparador tests
        working-directory: comparador
        run: python -m unittest discover -s tests

      # Uma loja fora do ar nao pode derrubar o deploy: o painel avisa o que faltou.
      - name: Build Shape Total x ByPharmacon panel
        working-directory: comparador
        run: python comparador.py --config config.json --sem-alertas || echo "::warning::Comparador terminou com coleta incompleta"

      - name: Build static Pages artifact
        run: npm run publish:site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
